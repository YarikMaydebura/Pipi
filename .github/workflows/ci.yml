# Runs every check on Windows AND macOS, so "works on both" is proven on each push.
# No secrets are used: tests run with fakes only, never against the real OpenAI key.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # building/typechecking does not need the Electron binary
    steps:
      - uses: actions/checkout@v7

      # --- Brain (Python) ---
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install brain
        run: python -m pip install -e "./brain[dev]"
      - name: Ruff
        working-directory: brain
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        working-directory: brain
        run: python -m pytest -q
      - name: Brain entry point starts
        working-directory: brain
        run: python -m pipi_brain --config ../config/dev.yaml

      # --- TypeScript (shared, desktop-pet, web) ---
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install npm workspaces
        run: npm ci
      - name: Lint, format, typecheck, test
        run: npm run check
      - name: Build
        run: npm run build
