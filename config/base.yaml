# Shared defaults for every mode. Mode files (dev/study/demo.yaml) start with
# `extends: base.yaml` and only list what differs. Relative paths are relative to this folder.

mode: dev                 # overridden by every mode file
env_file: ../.env         # secrets (OPENAI_API_KEY, WOZ_TOKEN) live here, never in YAML

server:
  host: 127.0.0.1         # study/demo switch to 0.0.0.0 so the WoZ laptop can connect
  port: 8765

pet:
  robot_side: right       # which screen edge faces the robot; Pipi jumps off this side

bodies:                   # WebSocket bodies (desktop pet, fake robot); seconds
  hello_timeout_s: 5      # a new connection must introduce itself within this
  ack_timeout_s: 2        # every command must be acked within this (else logged + fallback)
  ack_retries: 1          # harmless commands (eyes, caption, body_config) are resent once
  migration_timeout_s: 8  # activate/deactivate are acked when the animation has finished
  speech_done_margin_s: 3 # waiting for speech_done = audio length + this
  caption_s_per_char: 0.07  # no audio: caption reading time estimate (pet uses 60 ms/char)
  connect_wait_s: 15      # `--voice-loop --body pet`: wait this long for the pet at start
  stop_timeout_s: 1       # emergency stop: a body must ack `stop` within this (else the old
                          # workaround: empty speak + no caption + idle eyes)

robot:
  body: fake_robot        # fake_robot | alpha_mini
  ridk_url: ws://wamp.robotsindeklas.nl  # RidK WAMP router (course examples); realm: RIDK_REALM in .env
  ridk_connect_timeout_s: 15
  ridk_call_timeout_s: 20 # one RidK call; motions and speech can take several seconds

timers:
  focus_s: 240            # fixed reading time before the break (4 min)
  focus_precue_s: 210     # 3:30 -> small stretch/yawn animation as a soft pre-cue
  break_max_s: 300        # forces ROBOT_GOODBYE if the break runs long; null = no limit
  silence_reprompt_s: 12  # one gentle re-prompt after this much silence

models:                   # course rule: only these three models are allowed (enforced in code)
  dialogue: gpt-5-nano
  stt: gpt-4o-mini-transcribe
  tts: gpt-4o-mini-tts
  tts_voice: nova

persona:
  default: cheerful       # id from personas.yaml
  allow_choice: true      # false = everyone gets `default` (option for the study)

dialogue:
  personas_file: personas.yaml
  lines_file: lines.yaml  # fixed lines (fallbacks, re-prompts) with persona variants
  prompts_dir: prompts    # <phase>.txt instructions for the LLM, e.g. prompts/greeting.txt
  reasoning_effort: minimal  # gpt-5-nano: minimal | low | medium | high (minimal = fastest)
  max_output_tokens: 800  # includes reasoning tokens; too low -> empty answer -> fallback line
  history_turns: 6        # recent turns sent to the LLM as context
  llm_retries: 1          # invalid JSON / error -> 1 retry -> scripted fallback line

audio:
  sample_rate: 16000      # 16000 | 8000 (Silero VAD supports only these)
  input_device: null      # null = system default microphone; or a device name / index
  output_device: null     # null = system default speaker
  gate_tail_ms: 300       # half-duplex: mic stays closed this long after Pipi stops speaking
  mic_frame_timeout_s: 2.0  # no audio frames for this long = microphone failure

vad:
  engine: silero          # silero | energy (energy = loudness fallback, needs no model)
  threshold: 0.5          # speech probability that starts an utterance
  end_silence_ms: 700     # utterance ends after this much silence
  min_speech_ms: 250      # shorter sounds (coughs, clicks) are ignored
  pre_roll_ms: 300        # audio kept from just before speech started (first syllable)
  max_utterance_s: 15
  energy_threshold_dbfs: -40  # energy fallback only: louder than this counts as speech
  model_path: ../cache/silero_vad.onnx   # gitignored; downloaded on first run
  model_url: https://github.com/snakers4/silero-vad/raw/v5.1.2/src/silero_vad/data/silero_vad.onnx
  model_sha256: 2623a2953f6ff3d2c1e61740c6cdb7168133479b267dfef114a4a3cc5bdd788f
  download_timeout_s: 30

timeouts:                 # seconds; on timeout the fallback is used and an error is logged
  stt_s: 6
  llm_s: 6                # per attempt
  tts_s: 6
  playback_margin_s: 3    # waiting for playback = audio length + this

logging:
  dir: ../logs            # gitignored; one folder per session
  save_audio: false       # participant audio is NOT stored by default
  verbose: false

cues:                     # identity cues we intend to show (actual state is logged per session)
  same_eyes: true
  same_voice: true
  signature_phrase: true
  signature_gesture: true
  memory_references: true
  transition_animation: true

woz:                      # Wizard-of-Oz panel server (HTTP + WebSocket, docs/SYSTEM_DESIGN.md §4.8)
  host: 127.0.0.1         # study/demo: 0.0.0.0 so a second laptop/phone can open the panel
  port: 8766              # panel: http://<laptop-ip>:8766/woz/?token=<WOZ_TOKEN>
  max_panels: 3           # concurrent panels (experimenter laptop + phone + spare)
  web_dist: ../web/dist   # built by `npm run build`; also serves /fake-robot/
  command_timeout_s: 15   # a command without result after this is acked ok=false (still logged)

session:                  # full session flow (docs/INTERACTION_FLOW.md); seconds
  persona_pick_s: 30      # no persona chosen within this -> persona.default
  greeting_max_turns: 6   # participant answers in GREETING before FOCUS starts anyway
  greeting_max_s: 90
  chat_max_exchanges: 3   # CHAT: max participant answers, then Crocodile
  chat_max_s: 45
  game_menu_s: 15         # no clear game choice within this -> default_game
  default_game: quick_draw
  first_game: crocodile_robot  # GAME_CROCODILE plays this first; null = straight to the menu
  game_loop: false        # true (demo): after a game, back to the menu until "stop"
  return_end_s: 30        # RETURN -> END after this; null = the WoZ ends the session
  flight_s: 0.8           # silence between Pipi jumping off the screen and the robot waking up
  robot_connect_wait_s: 3 # a migration waits this long for a missing robot, then stays on the pet
  thinking_delay_ms: 300  # thinking eyes if Pipi's reply takes longer than this
  health_poll_s: 1        # body health check (WoZ state + alerts on disconnect)
  interrupt_retry_s: 3    # safety net: a phase still running this long after a WoZ command is
                          # stopped again (at a safe point) and a warning is logged
  reading_text_file: null # M6: study reading text, given to the LLM for word help in FOCUS

tts_cache:                # fixed lines' speech cached on disk -> they play instantly
  enabled: true
  dir: ../cache/tts       # gitignored; key = hash(model, voice, text); fixed lines only
  prewarm_timeout_s: 60   # background synthesis of all fixed lines at session start
  prewarm_concurrency: 4

games:                    # game content (docs/GAMES.md); validated at startup
  games_file: games.yaml  # word lists, rounds, timings, the bang threshold, the good-sport setting
  motions_file: motions.yaml  # canonical motion names -> what each body plays
