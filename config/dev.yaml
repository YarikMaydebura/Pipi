# Development: fake robot, short timers, verbose logging.
extends: base.yaml
mode: dev

robot:
  body: fake_robot

timers:
  focus_s: 30
  focus_precue_s: 20
  break_max_s: 120

logging:
  verbose: true

session:                  # short timers so a whole session takes ~3 minutes
  persona_pick_s: 15
  greeting_max_s: 60
  chat_max_s: 30
  game_menu_s: 10
  game_placeholder_s: 8
  return_end_s: 15
