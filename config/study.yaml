# Participant sessions: real robot, fixed flow, 4-minute focus (defaults from base.yaml).
# Keep this file small: every participant must get exactly the same settings.
extends: base.yaml
mode: study

server:
  host: 0.0.0.0           # WoZ panel runs on a second laptop

robot:
  body: alpha_mini

woz:
  host: 0.0.0.0           # panel on a second device over the LAN; needs WOZ_TOKEN in .env

session:
  return_end_s: null      # the experimenter ends the session in the WoZ panel
