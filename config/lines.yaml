# Fixed lines: NOT generated by the LLM (docs/PERSONA_AND_PROMPTS.md section 4).
# Each line has a `default` text and optional per-persona variants (cheerful/calm/witty).
# Keep every line short: max 2 sentences.
lines:
  opening:
    default: "Hi, I'm Pipi! What's your name?"
    cheerful: "Hiya, I'm Pipi! What's your name?"
    calm: "Hello there, I'm Pipi. What's your name?"
    witty: "Oh, a human! I'm Pipi. And you are?"
  stt_retry:
    default: "Sorry, could you say that again?"
    witty: "Sorry, my ears glitched. Could you say that again?"
  llm_fallback:
    default: "Hmm, I lost my train of thought. Tell me a bit more?"
    calm: "Sorry, I drifted off for a second. Could you tell me a bit more?"
  silence_reprompt:
    default: "Still there? Take your time."
    cheerful: "Still there? No rush!"
  goodbye:
    default: "Bye for now! It was nice talking to you."
