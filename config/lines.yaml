# Fixed lines: NOT generated by the LLM (docs/PERSONA_AND_PROMPTS.md section 4).
# Each line has a `default` text and optional per-persona variants (cheerful/calm/witty).
# Keep every line short: max 2 sentences.
lines:
  opening:
    default: "Hi, I'm Pipi! What's your name?"
    cheerful: "Hiya, I'm Pipi! What's your name?"
    calm: "Hello there, I'm Pipi. What's your name?"
    witty: "Oh, a human! I'm Pipi. And you are?"
  stt_retry:
    default: "Sorry, could you say that again?"
    witty: "Sorry, my ears glitched. Could you say that again?"
  llm_fallback:
    default: "Hmm, I lost my train of thought. Tell me a bit more?"
    calm: "Sorry, I drifted off for a second. Could you tell me a bit more?"
  silence_reprompt:
    default: "Still there? Take your time."
    cheerful: "Still there? No rush!"
  goodbye:
    default: "Bye for now! It was nice talking to you."

  # --- Session flow (M3, docs/INTERACTION_FLOW.md). {name} lines are never disk-cached. ---
  persona_intro:
    default: "Hi, I'm Pipi! Should I be cheerful, calm or witty? You can click one or just tell me!"
  persona_unclear:
    default: "Sorry, which one: cheerful, calm or witty?"
  persona_chosen:
    default: "Great choice!"
    cheerful: "Yay, cheerful it is!"
    calm: "Calm it is. Nice and easy."
    witty: "Witty? Bold choice. I like it."
  persona_default:
    default: "No worries, I'll just be my usual self!"
    cheerful: "No worries, I'll be my cheerful self!"
  greeting_ask_name:
    default: "So, what's your name?"
    calm: "So, what's your name?"
    witty: "First things first: what's your name?"
  focus_start:
    default: "Okay, time to read! I'll be right here. Ask me if a word is unclear!"
    calm: "Okay, time to read. I'll be right here; just ask if a word is unclear."
    witty: "Reading time! I'll be right here, ask me if a word looks suspicious."
  migration_announce:
    default: "Break time! I'm coming over!"
    calm: "Time for a little break. I'm coming over to you."
    witty: "Break time! Watch me jump into my robot body."
  migration_unavailable:
    default: "Hmm, my robot body is still asleep. Let's take our break right here on the screen!"
  robot_wake:
    default: "Ta-da! Hi again, {name}!"
  robot_wake_noname:
    default: "Ta-da! Hi again!"
  robot_wake_plain:
    default: "Hi again, {name}! It's me, Pipi."
  robot_wake_plain_noname:
    default: "Hi again! It's me, Pipi."
  chat_transition:
    default: "Okay, I have a challenge for you!"
    calm: "Okay, I have a little challenge for you."
    witty: "Okay, enough small talk. I have a challenge for you."
  # --- Game menu (M4, docs/GAMES.md §4). {options} = the games that can be played right now,
  # e.g. "Crocodile or a duel"; {game} = how the menu names a game, e.g. "a duel". ---
  game_menu:          # a colon, not "?": {options} may start with "a duel" (lowercase)
    default: "What do you want to play next: {options}?"
  game_menu_one:      # only one game can be played right now
    default: "Do you want to play {options}?"
  game_menu_clarify:
    default: "Sorry, which game: {options}?"
  game_menu_list:
    default: "I can play {options}. Which one?"
  game_unavailable:
    default: "I can't play that one yet. How about {options}?"
  game_chosen:
    default: "Okay, {game} it is!"
  game_choice_default:
    default: "Let's do {game} then!"
  game_unavailable_now:
    default: "Hmm, I can't play that one right now. Let's do something else."
  game_motion_failed:
    default: "Hmm, my body does not want to move right now. Let's try something else."
  game_stop_ok:
    default: "Okay, no more games!"
    calm: "Sure, that's enough games."
  game_switch_ok:
    default: "Sure, let's play something else!"

  # --- Crocodile: the robot acts, you guess (game rules may be longer than 2 sentences).
  # {answer} = the word as Pipi names it, e.g. "a bird". NEVER spoken while acting. ---
  crocodile_rules:
    default: "Let's play Crocodile! I'll act something out. I'm not allowed to talk, only show. You guess!"
    calm: "Let's play Crocodile. I'll act something out without talking, only showing. You guess."
    witty: "Let's play Crocodile! I act, and I'm not allowed to talk. Tragic, I know. You guess!"
  crocodile_watch:
    default: "Okay, watch closely!"
  crocodile_next:
    default: "Here comes the next one!"
  crocodile_correct:
    default: "Yes! I was {answer}! Well guessed!"
    calm: "Yes, exactly. I was {answer}. Nicely guessed."
    witty: "Yes! I was {answer}! My acting is clearly award-winning."
  crocodile_reveal:
    default: "Ooh, tricky one! I was {answer}!"
    witty: "I was {answer}! I thought that was Oscar-worthy."

  # --- Quick-draw duel. {n} = round number, {score} = e.g. "2 to 1". ---
  quick_draw_rules:
    default: "Duel time! When my eyes turn green, shout BANG! Fastest wins. Don't shoot early!"
    calm: "A little duel. When my eyes turn green, shout BANG. The fastest wins, and don't shoot early."
  quick_draw_rules_typed:
    default: "Duel time! When my eyes turn green, press Enter! Fastest wins. Don't shoot early!"
  quick_draw_rules_slow:
    default: "Duel time, in slow motion! When my eyes turn green, say bang! Don't shoot early!"
  quick_draw_slow_motion:
    default: "Oops, my ears got confused. This is a slow-motion duel! When my eyes turn green, say bang!"
  quick_draw_round:
    default: "Round {n}. Ready?"
  quick_draw_false_start:
    default: "Too early! My eyes were not green yet, so this round is mine."
    witty: "Too early, partner! My eyes were not green yet. That round is mine."
  quick_draw_you_win:
    default: "Argh, you got me!"
    witty: "Argh! Hit by a human. How embarrassing."
  quick_draw_robot_wins:
    default: "Bang! Got you!"
  quick_draw_too_slow:
    default: "Too slow! Bang!"
  quick_draw_no_contest:
    default: "Hmm, that round does not count."
  quick_draw_final_you:
    default: "You win the duel, {score}! Fastest hands in the west."
  quick_draw_final_robot:
    default: "I win the duel, {score}! Good duel, partner."

  # --- Staring contest (docs/GAMES.md §3.3) ---
  staring_rules:
    default: "Staring contest! Look into my eyes. The first one to blink loses."
    witty: "Staring contest! Look into my eyes. Warning: robots are very good at this."
  staring_rules_pretend:
    default: "Staring contest! Look into my eyes. The first one to blink loses. Be honest: if you blink, tell me!"
  staring_go:
    default: "Ready... go!"
  staring_you_win:
    default: "Argh! My eyes! You win!"
    witty: "Argh! My eyes are drying out. You win, human."
  staring_you_blinked:
    default: "You blinked! I win!"
    witty: "You blinked! Robots don't need to, you know."
  staring_admitted:
    default: "You blinked? Thanks for being honest. This one's mine!"

  # --- Arm rock-paper-scissors (docs/GAMES.md §3.4). {you} / {me} = rock | paper | scissors ---
  rps_rules:
    default: "Rock, paper, scissors, with arms! Rock is arms down, paper is arms wide, scissors is arms crossed. Show me yours and say it!"
  rps_count:
    default: "Rock... paper... scissors..."
  rps_shoot:
    default: "Shoot!"
  rps_unclear:
    default: "Was that rock, paper or scissors?"
  rps_no_answer:
    default: "I didn't hear your choice. That round doesn't count."
  rps_you_win:
    default: "Your {you} beats my {me}! Your point."
  rps_robot_wins:
    default: "My {me} beats your {you}! My point."
    witty: "My {me} beats your {you}! Robots one, humans zero."
  rps_draw:
    default: "We both chose {me}! No points."
  rps_final_you:
    default: "You win, {score}! Rock-paper-scissors champion."
  rps_final_robot:
    default: "I win, {score}! Good game."
  rps_final_draw:
    default: "It's a tie, {score}! Good game."

  # --- Goodbye / RETURN fallbacks (used only when the LLM fails). {moment} = a game moment
  # from memory.game_events, already a full sentence ("You guessed that I was a bird ...!"). ---
  robot_goodbye:
    default: "That was fun! Okay, back to your text. See you on the screen!"
  robot_goodbye_game:
    default: "{moment} Okay, back to your text. See you on the screen!"
  return_fallback:
    default: "I'm back on your screen! Good luck with the questions."
  return_fallback_game:
    default: "I'm back on your screen! {moment} Good luck with the questions."
