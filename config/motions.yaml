# Motion library (docs/GAMES.md §2). Games only use the canonical names on the left.
# Per body: what the brain sends in the `motion` message.
#   a name  = this body plays it (fake_robot / desktop_pet: the canonical name is sent as it is;
#             the body has a clip, an alias or a procedural motion with that name)
#   null    = this body cannot play it (yet): the motion is skipped and logged
#
# alpha_mini: a move name from alpha_mini.yaml, which only uses verified RidK calls (head pitch,
# BlocklyStand, BlocklyWaveRightArm from the course examples). NEVER invent RidK names: test a
# new joint / behavior in the lab (robot_check), then add it there. null = needs an unverified
# joint (arms, head yaw): Crocodile only picks words the active body can act.
#
# fake_robot (web/src/fake-robot/motionPlan.ts): unknown names get an error ack. act_* and
# duel_ready are HELD (they loop until the next motion, `idle`, `stop` or sleep; sending the
# same name again continues without restarting); everything else plays once and rests.
# Aliases on the body side: wave -> signature_wave, excited -> happy.
# desktop_pet: has no act_* / duel_* clips (it answers "unknown motion"), so they are null:
# games run on the robot body. If the break has to run on the screen (robot missing),
# Crocodile is hidden and the duel is played with the eyes only.
motions:
  # --- System ---------------------------------------------------------------------------------
  idle:           {group: system, fake_robot: idle, desktop_pet: idle, alpha_mini: idle}  # ends a held motion
  # --- Social ---------------------------------------------------------------------------------
  wave:           {group: social, fake_robot: wave, desktop_pet: wave, alpha_mini: wave}
  signature_wave: {group: social, fake_robot: signature_wave, desktop_pet: signature_wave, alpha_mini: wave}
  nod:            {group: social, fake_robot: nod, desktop_pet: nod, alpha_mini: nod}
  shake_head:     {group: social, fake_robot: shake_head, desktop_pet: shake_head, alpha_mini: null}
  think:          {group: social, fake_robot: think, desktop_pet: think, alpha_mini: null}
  excited:        {group: social, fake_robot: excited, desktop_pet: excited, alpha_mini: excited}
  celebrate:      {group: social, fake_robot: celebrate, desktop_pet: celebrate, alpha_mini: celebrate}
  sad:            {group: social, fake_robot: sad, desktop_pet: sad, alpha_mini: null}
  shrug:          {group: social, fake_robot: shrug, desktop_pet: shrug, alpha_mini: null}
  bow:            {group: social, fake_robot: bow, desktop_pet: bow, alpha_mini: null}
  wake_up:        {group: social, fake_robot: wake_up, desktop_pet: wake_up, alpha_mini: wake_up}
  sleep:          {group: social, fake_robot: sleep, desktop_pet: sleep, alpha_mini: sleep}
  # --- Crocodile (one per word in games.yaml) -------------------------------------------------
  act_bird:       {group: crocodile, fake_robot: act_bird, desktop_pet: null, alpha_mini: null}
  act_boxer:      {group: crocodile, fake_robot: act_boxer, desktop_pet: null, alpha_mini: null}
  act_swimmer:    {group: crocodile, fake_robot: act_swimmer, desktop_pet: null, alpha_mini: null}
  act_dancer:     {group: crocodile, fake_robot: act_dancer, desktop_pet: null, alpha_mini: act_dancer}
  act_robot:      {group: crocodile, fake_robot: act_robot, desktop_pet: null, alpha_mini: act_robot}
  act_sleeping:   {group: crocodile, fake_robot: act_sleeping, desktop_pet: null, alpha_mini: act_sleeping}
  act_superhero:  {group: crocodile, fake_robot: act_superhero, desktop_pet: null, alpha_mini: null}
  act_drummer:    {group: crocodile, fake_robot: act_drummer, desktop_pet: null, alpha_mini: null}
  # --- Duel -----------------------------------------------------------------------------------
  duel_ready:     {group: duel, fake_robot: duel_ready, desktop_pet: null, alpha_mini: null}
  duel_draw:      {group: duel, fake_robot: duel_draw, desktop_pet: null, alpha_mini: null}
  duel_hit:       {group: duel, fake_robot: duel_hit, desktop_pet: null, alpha_mini: null}
  duel_win:       {group: duel, fake_robot: duel_win, desktop_pet: null, alpha_mini: null}
  # --- RPS and staring (M6: no clips on any body yet) -----------------------------------------
  rps_shake:      {group: rps, fake_robot: null, desktop_pet: null, alpha_mini: null}
  rps_rock:       {group: rps, fake_robot: null, desktop_pet: null, alpha_mini: null}
  rps_paper:      {group: rps, fake_robot: null, desktop_pet: null, alpha_mini: null}
  rps_scissors:   {group: rps, fake_robot: null, desktop_pet: null, alpha_mini: null}
  stare_ready:    {group: staring, fake_robot: null, desktop_pet: null, alpha_mini: null}
  stare_lose:     {group: staring, fake_robot: null, desktop_pet: null, alpha_mini: null}
