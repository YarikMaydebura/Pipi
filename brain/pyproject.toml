[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipi-brain"
version = "0.1.0"
description = "The brain of Pipi: state machine, speech, LLM, memory, study logging, body control"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.99,<3",          # STT / LLM / TTS (gpt-4o-mini-transcribe, gpt-5-nano, gpt-4o-mini-tts)
    "numpy>=1.26,<3",           # audio frames
    "sounddevice>=0.4.6,<0.6",  # microphone + speaker (PortAudio wheels for Windows + macOS)
    "onnxruntime>=1.17,<2",     # Silero VAD without torch (~15 MB instead of hundreds)
    "websockets>=15,<17",       # body server (desktop pet, fake robot); 15+ for regex origins
    "autobahn>=24.4,<27",       # RidK (Alpha Mini) is WAMP; asyncio flavour, no twisted
    "msgpack>=1.0,<2",          # the RidK router speaks msgpack (course examples)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]
# Webcam blink detector for the staring contest (vision/blink.py). Optional because MediaPipe
# >= 0.10.30 has no wheel for Intel Macs (macOS x86_64); Windows and Apple-silicon Macs are
# fine. Without it the detector reports "mediapipe not installed" and the game pretends.
# opencv-contrib-python is what mediapipe itself pulls in: never add opencv-python(-headless)
# next to it, both install the same ``cv2`` folder. <5: opencv 5 wheels need macOS 15.
vision = [
    "mediapipe>=1.2,<2",
    "opencv-contrib-python>=4.10,<5",
]

[tool.setuptools.packages.find]
include = ["pipi_brain*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
