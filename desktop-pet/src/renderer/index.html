<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- blob: is needed by the glb loader for embedded data; everything else stays local.
         connect-src: only WebSockets on this machine (the brain; Vite's dev reload in dev). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Pipi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="pet" aria-label="Pipi, your study companion">
      <!-- Subtitles of what Pipi says (filled with textContent only). -->
      <div id="speech-bubble" class="speech-bubble" data-visible="false" aria-hidden="true">
        <p class="speech-bubble-text" aria-live="polite"></p>
      </div>
      <canvas id="pet-canvas" class="pet-canvas" aria-hidden="true"></canvas>
      <!-- PERSONA_PICK: three small cards under Pipi (persona/personaCards.ts). -->
      <nav
        id="persona-cards"
        class="persona-cards"
        aria-label="Choose Pipi's personality"
        data-visible="false"
        hidden
      ></nav>

      <!-- 2D fallback, shown only if WebGL or the 3D model fails. -->
      <div id="pet-fallback" class="pet-fallback" hidden>
        <div class="fallback-face" data-state="idle">
          <span class="fallback-eye"><span class="fallback-eye-fill"></span></span>
          <span class="fallback-eye"><span class="fallback-eye-fill"></span></span>
          <span class="fallback-cheek fallback-cheek-left"></span>
          <span class="fallback-cheek fallback-cheek-right"></span>
          <!-- The mouth (an inline SVG) is added by fallback/fallbackMouth.ts. -->
        </div>
      </div>

      <!-- Showcase mode only (npm run showcase): the name of the animation that is playing. -->
      <p id="showcase-label" class="showcase-label" role="status" hidden></p>
      <p id="debug-label" class="debug-label" role="status" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
